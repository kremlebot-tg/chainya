name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Production deployment validates the live sibling catalog separately.
      # CI uses a public, secret-free snapshot so a clean checkout is testable.
      CHAINYA_CATALOG_PATH: backend/tests/fixtures/catalog.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Build production site
        run: python build.py --web
      - name: Verify release bundle
        run: python scripts/verify-release.py --dist dist
