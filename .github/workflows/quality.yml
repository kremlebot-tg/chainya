name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            telegram-bot/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r telegram-bot/requirements.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Run Telegram bot tests
        run: PYTHONPATH=telegram-bot python -m pytest -q telegram-bot/test_bot_booking.py
      - name: Validate shell scripts and deploy contract
        run: |
          bash -n deploy.sh deploy-shop.sh deploy-edge.sh deploy-bot.sh ops/deploy-shop-remote.sh ops/timeweb/edge-maintenance.sh
          python scripts/check-deploy-contract.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements.txt
      - name: Check blocking Python errors
        run: python -m ruff check backend scripts build.py --select E9,F
      - name: Build production site
        run: python build.py --web
      - name: Verify release bundle
        run: python scripts/verify-release.py --dist dist
