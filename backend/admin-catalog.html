<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1c1814">
  <link rel="icon" href="/favicon.png">
  <title>Каталог · Управление · Чайня</title>
  <style>
    @font-face{font-family:Prata;src:url('/fonts/prata-cyr.woff2') format('woff2');font-display:swap}@font-face{font-family:Golos;src:url('/fonts/golos-cyr.woff2') format('woff2');font-display:swap}
    :root{color-scheme:dark;--bg:#17130f;--panel:#201a15;--panel2:#29211a;--panel3:#30271f;--text:#f4ede2;--muted:#baaea0;--quiet:#93877a;--line:#45392f;--line2:#6b5949;--red:#c45b4b;--red2:#a94739;--paper:#eadfce;--ink:#211b16;--green:#a7bc99;--amber:#d5a565;--shadow:0 28px 80px #08060470}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Golos,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--paper);outline-offset:2px}[hidden]{display:none!important}
    body{background:radial-gradient(circle at 74% -20%,#3b2b211f 0,transparent 38%),var(--bg)}.top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:#17130ff2;backdrop-filter:blur(16px)}.top__in{width:min(1480px,calc(100% - 40px));height:72px;margin:auto;display:flex;align-items:center;gap:18px}.brand{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:11px}.brand img{width:31px}.brand strong{font:18px Prata,serif}.crumb{color:var(--quiet)}.top__actions{margin-left:auto;display:flex;gap:8px}.btn{min-height:42px;border:1px solid var(--line2);background:transparent;color:var(--text);padding:0 16px;transition:background .18s,border-color .18s,color .18s,transform .18s}.btn:hover{background:var(--paper);border-color:var(--paper);color:var(--ink)}.btn:active{transform:translateY(1px)}.btn--primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:650}.btn--primary:hover{background:var(--red2);border-color:var(--red2);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .page{width:min(1480px,calc(100% - 40px));margin:32px auto 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:22px}.eyebrow{color:#c1a684;font-size:9px;font-weight:650;letter-spacing:.2em;text-transform:uppercase}.head h1{margin:7px 0 0;font:42px/1.08 Prata,serif}.head p{margin:9px 0 0;color:var(--muted)}.head-actions{display:flex;align-items:center;gap:18px}.state{color:var(--quiet);font-size:12px;text-align:right}.state::before{content:'';display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #a7bc9918}.add-primary{min-width:184px}.add-primary span{font-size:19px;line-height:0;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px;border:1px solid var(--line);background:#1b1612;box-shadow:0 14px 44px #08060428}.stat{min-height:82px;padding:15px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.stat:last-child{border-right:0}.stat span{color:var(--quiet);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.stat strong{margin-top:4px;font:24px/1.1 Prata,serif;color:var(--text);font-variant-numeric:tabular-nums}
    .layout{display:grid;grid-template-columns:minmax(320px,420px) minmax(560px,1fr);min-height:680px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}.sidebar{border-right:1px solid var(--line);background:#1d1813}.side-tools{position:sticky;top:72px;z-index:5;display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line);background:#1d1813f5;backdrop-filter:blur(12px)}.search{width:100%;height:58px;border:0;background:transparent;color:var(--text);padding:0 17px}.search::placeholder{color:var(--quiet)}.add{border:0;border-left:1px solid var(--line);background:transparent;color:var(--text);padding:0 17px;font-weight:600}.add:hover{background:var(--paper);color:var(--ink)}.items{max-height:calc(100vh - 155px);overflow:auto}.catalog-row{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:13px;align-items:center;text-align:left;padding:13px;border:0;border-bottom:1px solid #3b3027;background:transparent;color:var(--text);transition:background .16s}.catalog-row:hover,.catalog-row.is-active{background:var(--panel2)}.catalog-row.is-active{box-shadow:inset 4px 0 var(--red)}.catalog-row img{width:64px;height:64px;object-fit:cover;background:#32291f}.catalog-row__name{display:block;font-weight:650}.catalog-row__meta{display:block;margin-top:4px;color:var(--quiet);font-size:11px}.catalog-row__badges{display:flex;gap:5px;margin-top:7px}.tag{border:1px solid var(--line);padding:2px 6px;color:var(--quiet);font-size:9px;letter-spacing:.04em;text-transform:uppercase}.tag.on{color:var(--green);border-color:#607056}.tag.off{color:#de8c80;border-color:#70483f}.row-order{display:grid;gap:4px}.move{width:30px;height:28px;border:1px solid var(--line);background:transparent;color:var(--muted)}.move:hover{border-color:var(--paper);color:var(--text)}
    .editor{min-width:0;padding:30px 34px 40px;background:linear-gradient(180deg,#221c17 0,var(--panel) 26%)}.empty{height:100%;min-height:500px;display:grid;place-items:center;color:var(--quiet);text-align:center}.empty__in{max-width:360px;padding:42px}.empty__mark{width:72px;height:72px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid var(--line2);color:#c5aa89;font:36px Prata,serif}.empty strong{display:block;color:var(--text);font:25px Prata,serif;margin-bottom:9px}.empty p{margin:0 auto 22px;color:var(--muted)}.editor-head{display:flex;align-items:start;gap:21px;margin-bottom:27px}.photo{position:relative;width:160px;min-width:160px;height:160px;border:1px solid var(--line2);background:#302820;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo label{position:absolute;inset:auto 0 0;padding:11px;background:#17120de6;text-align:center;font-size:11px;cursor:pointer}.photo label:hover{background:var(--paper);color:var(--ink)}.photo input{position:absolute;opacity:0;pointer-events:none}.title-block{min-width:0;flex:1}.title-block h2{margin:5px 0 7px;font:32px/1.15 Prata,serif}.title-block p{margin:0;color:var(--quiet)}.save-state{display:block;margin-top:17px;color:var(--amber);font-size:11px}
    .section{margin-top:27px;padding-top:22px;border-top:1px solid var(--line)}.section h3{margin:0 0 15px;color:#baa283;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:grid;gap:6px}.field--wide{grid-column:1/-1}.field>span{color:var(--quiet);font-size:11px}.input,.textarea,.select{width:100%;border:1px solid var(--line2);background:#191511;color:var(--text);border-radius:0;padding:11px 12px}.input,.select{height:44px}.textarea{min-height:112px;resize:vertical}.input:disabled{color:var(--quiet);background:#211c17}.checks{display:flex;flex-wrap:wrap;gap:18px;padding-top:8px}.check{display:flex;align-items:center;gap:9px;color:var(--muted)}.check input{width:18px;height:18px;accent-color:var(--red)}
    .langs{display:flex;margin-bottom:14px}.lang{height:38px;min-width:92px;border:1px solid var(--line2);border-right:0;background:transparent;color:var(--muted)}.lang:last-child{border-right:1px solid var(--line2)}.lang[aria-selected=true]{background:var(--paper);color:var(--ink)}.language-panel{display:none}.language-panel.is-active{display:grid}.taste{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px}.taste label{display:grid;grid-template-columns:minmax(0,1fr) 35px;gap:10px;align-items:center;color:var(--muted);font-size:12px}.taste input{grid-column:1/-1;width:100%;accent-color:var(--red)}.taste output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}.footer-actions{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px -30px -40px;padding:14px 30px;border-top:1px solid var(--line);background:#211c17f5;backdrop-filter:blur(10px)}.hint{color:var(--quiet);font-size:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:420px;padding:13px 16px;background:var(--paper);color:var(--ink);box-shadow:0 12px 40px #0008}.skeleton{height:87px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#211c17,#2b241d,#211c17);background-size:200% 100%;animation:pulse 1.2s infinite}@keyframes pulse{to{background-position:-200% 0}}
    @media(max-width:900px){.top__in,.page{width:100%}.top__in{padding:0 14px}.crumb{display:none}.top__actions .btn:first-child{display:none}.page{margin-top:0}.head{align-items:stretch;padding:23px 16px 17px;margin:0}.head h1{font-size:34px}.head-actions{align-items:end}.state{display:none}.add-primary{min-width:0;white-space:nowrap}.stats{grid-template-columns:repeat(4,minmax(112px,1fr));overflow-x:auto;margin:0;border-left:0;border-right:0;box-shadow:none}.stat{min-height:74px;padding:13px 16px}.layout{grid-template-columns:1fr;border-left:0;border-right:0;box-shadow:none}.sidebar{border-right:0}.items{max-height:none}.editor{padding:23px 16px 38px;border-top:6px solid var(--bg)}.editor-head{align-items:center}.photo{width:108px;min-width:108px;height:108px}.title-block h2{font-size:23px}.grid,.grid.three,.taste{grid-template-columns:1fr}.footer-actions{margin:28px -16px -38px;padding:12px 16px}.hint{max-width:45%}.catalog-row{grid-template-columns:58px minmax(0,1fr) auto}.catalog-row img{width:58px;height:58px}}
    @media(max-width:560px){.head{display:grid}.head-actions{display:block}.add-primary{width:100%}.stats{grid-template-columns:repeat(4,112px)}.top__actions #reload{display:none}.empty__in{padding:30px 12px}.editor-head{align-items:flex-start}.photo{width:92px;min-width:92px;height:92px}}
    .mobile-back{display:none}@media(max-width:900px){.editor{scroll-margin-top:72px}.mobile-back{display:inline-block;margin:0 0 18px;border:0;background:transparent;color:var(--muted);padding:5px 0}.mobile-back:hover{color:var(--text)}}
  </style>
</head>
<body>
  <header class="top"><div class="top__in"><a class="brand" href="/manage"><img src="/img/logo-mark.webp" alt=""><strong>Чайня</strong></a><span class="crumb">/ Каталог</span><div class="top__actions"><a class="btn" href="/manage">Обзор и заказы</a><button class="btn" id="reload" type="button">Обновить</button><button class="btn" id="logout" type="button">Выйти</button></div></div></header>
  <main class="page">
    <div class="head"><div><span class="eyebrow">Управление витриной</span><h1>Каталог</h1><p>Товары, цены, наличие, фотографии и тексты на трёх языках.</p></div><div class="head-actions"><div class="state" id="catalog-state" aria-live="polite">Загрузка…</div><button class="btn btn--primary add-primary" id="add-top" type="button"><span aria-hidden="true">＋</span> Добавить товар</button></div></div>
    <section class="stats" aria-label="Сводка по каталогу">
      <div class="stat"><span>Всего товаров</span><strong id="stat-total">—</strong></div>
      <div class="stat"><span>На сайте</span><strong id="stat-published">—</strong></div>
      <div class="stat"><span>В наличии</span><strong id="stat-stock">—</strong></div>
      <div class="stat"><span>Скрыто</span><strong id="stat-hidden">—</strong></div>
    </section>
    <div class="layout">
      <aside class="sidebar"><div class="side-tools"><input class="search" id="search" type="search" placeholder="Найти чай…" aria-label="Поиск товаров"><button class="add" id="add" type="button">＋ Добавить</button></div><div class="items" id="items"><div class="skeleton"></div><div class="skeleton"></div></div></aside>
      <section class="editor" id="editor"><div class="empty"><div class="empty__in"><div class="empty__mark" aria-hidden="true">茶</div><strong>Выберите товар</strong><p>Откройте позицию слева для редактирования или создайте новую.</p></div></div></section>
    </div>
  </main>
  <div class="toast" id="toast" hidden role="status"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), TYPES_FALLBACK=[], AXES={floral:'Цветочный',fruity:'Фруктовый',driedfruit:'Сухофрукты',honey:'Медовый',nutty:'Ореховый',roasted:'Жареный',spicy:'Пряный',woody:'Древесный',herbal:'Травяной'};
let catalog=null, selectedId='', draft=null, dirty=false, pendingImage=null, previewUrl='';
function toast(message){const box=$('#toast');box.textContent=message;box.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.hidden=true,4200)}
function money(item){return new Intl.NumberFormat('ru-RU').format(item.price)+' ₽/'+(item.unit==='pc'?'шт':'10 г')}
function headers(json=true){return {'X-Chainya-Admin':'catalog',...(json?{'Content-Type':'application/json'}:{})}}
function clone(value){return JSON.parse(JSON.stringify(value))}
function typeName(id){return (catalog?.types||TYPES_FALLBACK).find(type=>type.id===id)?.name||id}
function setDirty(value=true){dirty=value;const state=$('#save-state');if(state)state.textContent=value?'Есть несохранённые изменения':'Все изменения сохранены';const save=$('#save');if(save)save.disabled=!value}
function updateState(){if(!catalog)return;const total=catalog.teas.length,published=catalog.teas.filter(item=>item.published).length,stock=catalog.teas.filter(item=>item.stock).length;$('#catalog-state').textContent=`Каталог сохранён · версия ${catalog.revision}`;$('#stat-total').textContent=total;$('#stat-published').textContent=published;$('#stat-stock').textContent=stock;$('#stat-hidden').textContent=total-published}
function safeImage(url){return /^\/img\/[A-Za-z0-9_-]+\.webp$/.test(url)||/^\/catalog-media\/[a-f0-9]{32}\.webp$/.test(url)?url:'/img/tea-baihao.webp'}
function renderList(){const box=$('#items'),query=$('#search').value.trim().toLocaleLowerCase('ru');box.replaceChildren();const rows=catalog.teas.filter(item=>`${item.name} ${item.orig} ${item.id} ${typeName(item.type)}`.toLocaleLowerCase('ru').includes(query));if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.style.minHeight='240px';empty.textContent='Ничего не найдено';box.append(empty);return}rows.forEach(item=>{const row=document.createElement('div');row.className='catalog-row'+(item.id===selectedId?' is-active':'');row.role='button';row.tabIndex=0;const image=document.createElement('img');image.src=safeImage(item.image_url);image.alt='';image.loading='lazy';const copy=document.createElement('span');const name=document.createElement('span');name.className='catalog-row__name';name.textContent=item.name;const meta=document.createElement('span');meta.className='catalog-row__meta';meta.textContent=`${typeName(item.type)} · ${money(item)}`;const badges=document.createElement('span');badges.className='catalog-row__badges';const published=document.createElement('span');published.className='tag '+(item.published?'on':'off');published.textContent=item.published?'На сайте':'Скрыт';const stock=document.createElement('span');stock.className='tag '+(item.stock?'on':'off');stock.textContent=item.stock?'В наличии':'Нет';badges.append(published,stock);copy.append(name,meta,badges);const order=document.createElement('span');order.className='row-order';const index=catalog.teas.findIndex(current=>current.id===item.id);[['↑',-1],['↓',1]].forEach(([label,direction])=>{const move=document.createElement('button');move.type='button';move.className='move';move.textContent=label;move.title=direction<0?'Поднять':'Опустить';move.disabled=index+direction<0||index+direction>=catalog.teas.length;move.onclick=event=>{event.stopPropagation();moveItem(item.id,direction)};order.append(move)});row.append(image,copy,order);row.onclick=()=>selectItem(item.id);row.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectItem(item.id)}};box.append(row)})}
function blankItem(){const translations={};['ru','en','zh'].forEach(lang=>translations[lang]={name:'',orig:'',desc:'',composition:'',manufacturer:'',shelf_life:'',storage:''});const taste={};Object.keys(AXES).forEach(axis=>taste[axis]=0);return{id:'',type:catalog.types[0]?.id||'white',price:0,unit:'g',stock:true,published:false,img:'tea-baihao',image:{kind:'seed',name:'tea-baihao'},image_url:'/img/tea-baihao.webp',taste,translations,name:'',orig:'',desc:''}}
function confirmDiscard(){return !dirty||confirm('Отменить несохранённые изменения?')}
function revealEditorMobile(){if(innerWidth>900)return;const back=document.createElement('button');back.type='button';back.className='mobile-back';back.textContent='← К списку товаров';back.onclick=()=>$('.sidebar').scrollIntoView({block:'start'});$('#editor').prepend(back);requestAnimationFrame(()=>$('#editor').scrollIntoView({block:'start'}))}
function selectItem(id){if(id===selectedId)return;if(!confirmDiscard())return;selectedId=id;draft=clone(catalog.teas.find(item=>item.id===id));pendingImage=null;clearPreview();setDirty(false);renderList();renderEditor();revealEditorMobile()}
function addItem(){if(!confirmDiscard())return;selectedId='';draft=blankItem();pendingImage=null;clearPreview();dirty=false;renderList();renderEditor();setDirty(true);revealEditorMobile()}
function clearPreview(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=''}
function renderEmptyEditor(root){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="empty__in"><div class="empty__mark" aria-hidden="true">茶</div><strong>Выберите товар</strong><p>Откройте позицию слева для редактирования или создайте новую со своим фото, ценой и описанием.</p><button class="btn btn--primary" type="button">＋ Добавить новый товар</button></div>';empty.querySelector('button').onclick=addItem;root.append(empty)}
function input(label,name,value,type='text',wide=false){const wrap=document.createElement('label');wrap.className='field'+(wide?' field--wide':'');const title=document.createElement('span');title.textContent=label;const field=document.createElement('input');field.className='input';field.type=type;field.name=name;field.value=value;field.required=name==='id'||name==='price'||name.endsWith('.name');if(type==='text')field.maxLength=name.endsWith('.name')?160:name.endsWith('.orig')?240:80;wrap.append(title,field);return wrap}
function textarea(label,name,value){const wrap=document.createElement('label');wrap.className='field field--wide';const title=document.createElement('span');title.textContent=label;const field=document.createElement('textarea');field.className='textarea';field.name=name;field.value=value;field.maxLength=5000;wrap.append(title,field);return wrap}
function renderEditor(){const root=$('#editor');root.replaceChildren();if(!draft){renderEmptyEditor(root);return}const form=document.createElement('form');form.id='catalog-form';form.addEventListener('submit',saveItem);form.addEventListener('input',()=>setDirty(true));const head=document.createElement('div');head.className='editor-head';const photo=document.createElement('div');photo.className='photo';const image=document.createElement('img');image.id='photo-preview';image.src=previewUrl||safeImage(draft.image_url);image.alt='Фото товара';const photoLabel=document.createElement('label');photoLabel.textContent='Сменить фото';const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.onchange=chooseImage;photoLabel.append(file);photo.append(image,photoLabel);const title=document.createElement('div');title.className='title-block';const eyebrow=document.createElement('span');eyebrow.className='eyebrow';eyebrow.textContent=selectedId?'Редактирование':'Новая позиция';const heading=document.createElement('h2');heading.id='editor-name';heading.textContent=draft.translations.ru.name||'Без названия';const note=document.createElement('p');note.textContent=selectedId?`Постоянный ID: ${draft.id}`:'Заполните карточку и сохраните — выбранное фото загрузится автоматически.';const saveState=document.createElement('span');saveState.className='save-state';saveState.id='save-state';saveState.textContent=dirty?'Есть несохранённые изменения':'Все изменения сохранены';title.append(eyebrow,heading,note,saveState);head.append(photo,title);form.append(head);
const base=document.createElement('div');base.className='section';base.innerHTML='<h3>Продажа и публикация</h3>';const baseGrid=document.createElement('div');baseGrid.className='grid three';const idField=input('ID для ссылки','id',draft.id);if(selectedId)idField.querySelector('input').disabled=true;const typeField=document.createElement('label');typeField.className='field';typeField.innerHTML='<span>Категория</span>';const select=document.createElement('select');select.className='select';select.name='type';catalog.types.forEach(type=>{const option=document.createElement('option');option.value=type.id;option.textContent=type.name;option.selected=type.id===draft.type;select.append(option)});typeField.append(select);const priceField=input(draft.unit==='pc'?'Цена за штуку, ₽':'Цена за 10 г, ₽','price',draft.price,'number');priceField.querySelector('input').min='0';priceField.querySelector('input').step='1';const unitField=document.createElement('label');unitField.className='field';unitField.innerHTML='<span>Единица продажи</span><select class="select" name="unit"><option value="g">Вес, цена за 10 г</option><option value="pc">Поштучно</option></select>';unitField.querySelector('select').value=draft.unit;const checks=document.createElement('div');checks.className='checks field--wide';checks.innerHTML=`<label class="check"><input type="checkbox" name="stock" ${draft.stock?'checked':''}> В наличии</label><label class="check"><input type="checkbox" name="published" ${draft.published?'checked':''}> Показывать на сайте</label>`;baseGrid.append(idField,typeField,priceField,unitField,checks);base.append(baseGrid);form.append(base);
const textSection=document.createElement('div');textSection.className='section';textSection.innerHTML='<h3>Название, описание и маркировка</h3>';const tabs=document.createElement('div');tabs.className='langs';[['ru','Русский'],['en','English'],['zh','中文']].forEach(([lang,label],index)=>{const button=document.createElement('button');button.type='button';button.className='lang';button.dataset.lang=lang;button.setAttribute('aria-selected',index===0?'true':'false');button.textContent=label;button.onclick=()=>switchLanguage(lang);tabs.append(button)});textSection.append(tabs);['ru','en','zh'].forEach((lang,index)=>{const values=draft.translations[lang];const panel=document.createElement('div');panel.className='grid language-panel'+(index===0?' is-active':'');panel.dataset.language=lang;panel.append(input('Название',`${lang}.name`,values.name,'text',true),input('Происхождение / подзаголовок',`${lang}.orig`,values.orig,'text',true),textarea('Описание',`${lang}.desc`,values.desc),textarea('Состав',`${lang}.composition`,values.composition||''),textarea('Изготовитель / упаковщик / импортёр',`${lang}.manufacturer`,values.manufacturer||''),input('Срок годности',`${lang}.shelf_life`,values.shelf_life||'','text',true),textarea('Условия хранения',`${lang}.storage`,values.storage||''));textSection.append(panel)});form.append(textSection);
const tasteSection=document.createElement('div');tasteSection.className='section';tasteSection.innerHTML='<h3>Вкусовой профиль · от 0 до 5</h3>';const taste=document.createElement('div');taste.className='taste';Object.entries(AXES).forEach(([axis,label])=>{const field=document.createElement('label');const name=document.createElement('span');name.textContent=label;const output=document.createElement('output');output.textContent=draft.taste[axis]||0;const range=document.createElement('input');range.type='range';range.min='0';range.max='5';range.step='1';range.name=`taste.${axis}`;range.value=draft.taste[axis]||0;range.oninput=()=>output.textContent=range.value;field.append(name,output,range);taste.append(field)});tasteSection.append(taste);form.append(tasteSection);
const actions=document.createElement('div');actions.className='footer-actions';const hint=document.createElement('span');hint.className='hint';hint.textContent=draft.published?'Изменения появятся на сайте сразу после сохранения':'Товар скрыт от покупателей';const save=document.createElement('button');save.type='submit';save.className='btn btn--primary';save.id='save';save.textContent='Сохранить товар';save.disabled=!dirty;actions.append(hint,save);form.append(actions);root.append(form);const nameInput=form.elements.namedItem('ru.name');nameInput.addEventListener('input',()=>heading.textContent=nameInput.value||'Без названия')}
function switchLanguage(lang){document.querySelectorAll('.lang').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.lang===lang)));document.querySelectorAll('.language-panel').forEach(panel=>panel.classList.toggle('is-active',panel.dataset.language===lang))}
function chooseImage(event){const file=event.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){event.target.value='';toast('Поддерживаются JPG, PNG и WebP');return}if(file.size>8*1024*1024){event.target.value='';toast('Фото должно быть не больше 8 МБ');return}pendingImage=file;clearPreview();previewUrl=URL.createObjectURL(file);$('#photo-preview').src=previewUrl;setDirty(true)}
function formItem(form){const data=new FormData(form),translations={},taste={};['ru','en','zh'].forEach(lang=>translations[lang]={name:String(data.get(`${lang}.name`)||'').trim(),orig:String(data.get(`${lang}.orig`)||'').trim(),desc:String(data.get(`${lang}.desc`)||'').trim(),composition:String(data.get(`${lang}.composition`)||'').trim(),manufacturer:String(data.get(`${lang}.manufacturer`)||'').trim(),shelf_life:String(data.get(`${lang}.shelf_life`)||'').trim(),storage:String(data.get(`${lang}.storage`)||'').trim()});Object.keys(AXES).forEach(axis=>taste[axis]=Number(data.get(`taste.${axis}`)||0));return{...draft,id:selectedId||String(data.get('id')||'').trim().toLowerCase(),type:String(data.get('type')),price:Number(data.get('price')),unit:String(data.get('unit')),stock:data.has('stock'),published:data.has('published'),taste,translations}}
async function parseResponse(response){let data={};try{data=await response.json()}catch(e){}if(response.status===401){location.replace('/manage');throw new Error('Сессия завершена')}if(!response.ok)throw new Error(data.detail||'Не удалось сохранить изменения');return data}
async function saveItem(event){event.preventDefault();const button=$('#save'),item=formItem(event.currentTarget);button.disabled=true;button.textContent='Сохраняем…';try{const creating=!selectedId,response=await fetch(creating?'/api/admin/catalog/items':`/api/admin/catalog/items/${encodeURIComponent(selectedId)}`,{method:creating?'POST':'PUT',headers:headers(),body:JSON.stringify({revision:catalog.revision,item})});catalog=await parseResponse(response);selectedId=item.id;draft=clone(catalog.teas.find(current=>current.id===selectedId));if(pendingImage){button.textContent='Обрабатываем фото…';const upload=await fetch(`/api/admin/catalog/items/${encodeURIComponent(selectedId)}/image?revision=${catalog.revision}`,{method:'POST',headers:headers(false),body:pendingImage});catalog=await parseResponse(upload);draft=clone(catalog.teas.find(current=>current.id===selectedId));pendingImage=null;clearPreview()}setDirty(false);updateState();renderList();renderEditor();toast(creating?'Товар добавлен':'Товар сохранён')}catch(error){toast(error.message);button.disabled=false;button.textContent='Сохранить товар'}}
async function moveItem(id,direction){if(dirty&&!confirmDiscard())return;const ids=catalog.teas.map(item=>item.id),from=ids.indexOf(id),to=from+direction;if(to<0||to>=ids.length)return;[ids[from],ids[to]]=[ids[to],ids[from]];try{const response=await fetch('/api/admin/catalog/order',{method:'PUT',headers:headers(),body:JSON.stringify({revision:catalog.revision,ids})});catalog=await parseResponse(response);updateState();renderList();toast('Порядок сохранён')}catch(error){toast(error.message)}}
async function loadCatalog(preserve=true){try{const response=await fetch('/api/admin/catalog',{cache:'no-store'});catalog=await parseResponse(response);updateState();if(preserve&&selectedId&&catalog.teas.some(item=>item.id===selectedId)){draft=clone(catalog.teas.find(item=>item.id===selectedId));dirty=false}else{selectedId='';draft=null;dirty=false}renderList();renderEditor()}catch(error){toast(error.message);$('#items').textContent='Не удалось загрузить каталог'}}
$('#search').addEventListener('input',()=>renderList());$('#add').onclick=addItem;$('#add-top').onclick=addItem;$('#reload').onclick=()=>{if(confirmDiscard())loadCatalog(true)};$('#logout').onclick=async()=>{await fetch('/api/admin/session',{method:'DELETE'});location.replace('/manage')};addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});loadCatalog(false);
</script>
</body>
</html>
