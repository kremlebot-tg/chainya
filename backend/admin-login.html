<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1c1814">
  <link rel="icon" href="/favicon.png">
  <title>Вход владельца · Чайня</title>
  <style>
    @font-face{font-family:Prata;src:url('/fonts/prata-cyr.woff2') format('woff2');font-display:swap}
    @font-face{font-family:Golos;src:url('/fonts/golos-cyr.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}html{color-scheme:dark;background:#1c1814}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:#1c1814;color:#f1ebe1;font:15px/1.55 Golos,Arial,sans-serif}.card{width:min(430px,100%);padding:34px;border:1px solid #5a4c3f;background:#211c17}.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.brand img{width:34px;height:42px;object-fit:contain}.brand strong{display:block;font:20px/1 Prata,serif}.brand small{display:block;margin-top:6px;color:#9a8f82;font-size:9px;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:34px/1.15 Prata,serif}p{margin:13px 0 24px;color:#b4a99b}label{display:block;margin-bottom:8px;color:#b4a99b;font-size:12px}.input{width:100%;height:50px;padding:0 14px;border:1px solid #6c5d4e;border-radius:0;background:#1c1814;color:#f1ebe1;font:16px Golos,Arial,sans-serif}.input:focus{outline:2px solid #e8dfcf;outline-offset:2px}.button{width:100%;min-height:50px;margin-top:14px;border:1px solid #e8dfcf;background:#e8dfcf;color:#211b16;font:600 15px Golos,Arial,sans-serif;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin:13px 0 0;color:#d88979;font-size:13px}.note{margin:24px 0 0;padding-top:18px;border-top:1px solid #4b4035;color:#9a8f82;font-size:12px}@media(max-width:520px){body{padding:0}.card{min-height:100svh;padding:28px 20px;border:0;display:flex;flex-direction:column;justify-content:center}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/img/logo-mark.webp" alt=""><div><strong>Чайня</strong><small>вход владельца</small></div></div>
    <h1>Управление</h1>
    <p>Введите ключ владельца. После проверки сервер создаст закрытую сессию на 12 часов.</p>
    <form id="login">
      <label for="token">Ключ доступа</label>
      <input class="input" id="token" type="password" autocomplete="current-password" required minlength="16">
      <button class="button" id="submit" type="submit">Войти</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Ключ не сохраняется в браузерном хранилище и после входа удаляется из адресной строки.</p>
  </main>
<script>
const form=document.querySelector('#login'),input=document.querySelector('#token'),button=document.querySelector('#submit'),status=document.querySelector('#status');
const fragment=decodeURIComponent(location.hash.slice(1));
if(fragment)input.value=fragment;
history.replaceState(null,'',location.pathname);
async function login(token){
  button.disabled=true;status.textContent='';
  try{
    const response=await fetch('/api/admin/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(!response.ok)throw new Error(response.status===429?'Слишком много попыток. Попробуйте позже.':'Ключ не подошёл.');
    input.value='';location.replace('/manage');
  }catch(error){status.textContent=error.message;button.disabled=false;input.focus()}
}
form.addEventListener('submit',event=>{event.preventDefault();login(input.value.trim())});
if(fragment)login(fragment);
</script>
</body>
</html>
