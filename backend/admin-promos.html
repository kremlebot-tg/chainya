<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Промокоды · Чайня</title>
<style>@font-face{font-family:Golos;src:url('/fonts/golos-cyr.woff2')}@font-face{font-family:Prata;src:url('/fonts/prata-cyr.woff2')}*{box-sizing:border-box}body{margin:0;background:#1c1814;color:#f1ebe1;font:16px/1.5 Golos,Arial,sans-serif}main{width:min(1040px,calc(100% - 32px));margin:38px auto 80px}a{color:#d5c8b8}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.head h1{font:42px/1.1 Prata,serif;margin:8px 0}.muted{color:#a99e91}.grid{display:grid;grid-template-columns:minmax(290px,.72fr) 1.28fr;gap:20px}.panel{border:1px solid #51463b;background:#211c17;padding:24px}.panel h2{font:24px Prata,serif;margin:0 0 18px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#b9ad9f;font-size:13px}.input{width:100%;min-height:46px;border:1px solid #6c5d4e;background:#1c1814;color:#f1ebe1;padding:10px 12px;font:inherit}.check{display:flex;gap:10px;align-items:center;margin:16px 0}.btn{min-height:44px;border:1px solid #7b6d5e;background:transparent;color:#f1ebe1;padding:10px 16px;font:inherit;cursor:pointer}.btn.primary{background:#bd5646;border-color:#bd5646}.btn:disabled{opacity:.55}.promo{border-top:1px solid #51463b;padding:18px 0}.promo:first-child{border-top:0}.promo__top{display:flex;justify-content:space-between;gap:12px}.code{font:22px Prata,serif}.badge{font-size:12px;padding:4px 8px;border:1px solid #6c5d4e}.badge.off{color:#d28c7f}.meta{margin:8px 0;color:#b9ad9f}.actions{display:flex;gap:8px;margin-top:12px}.status{min-height:24px;margin-top:12px;color:#d8b781}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}.head h1{font-size:34px}}</style></head>
<body><main><header class="head"><div><a href="/manage">← Управление</a><h1>Промокоды</h1><p class="muted">Скидка применяется к товарам. Доставка не меняется; чек, оплата и Saby получают одинаковые цены.</p></div></header><div class="grid"><section class="panel"><h2 id="form-title">Новый промокод</h2><form id="form"><div class="field"><label for="code">Код</label><input class="input" id="code" maxlength="32" pattern="[A-Za-z0-9-]{3,32}" placeholder="WELCOME10" required></div><div class="field"><label for="percent">Скидка, %</label><input class="input" id="percent" type="number" min="1" max="90" value="10" required></div><div class="field"><label for="minimum">Минимальная сумма товаров, ₽</label><input class="input" id="minimum" type="number" min="0" value="0" required></div><div class="field"><label for="expires">Работает до (необязательно)</label><input class="input" id="expires" type="datetime-local"></div><div class="field"><label for="note">Заметка для команды</label><input class="input" id="note" maxlength="240" placeholder="Например: листовка открытия"></div><label class="check"><input id="active" type="checkbox" checked> Промокод включён</label><button class="btn primary" id="save" type="submit">Создать промокод</button><button class="btn" id="reset" type="button" hidden>Отмена</button><p class="status" id="status" role="status"></p></form></section><section class="panel"><h2>Все промокоды</h2><div id="list"><p class="muted">Загружаем…</p></div></section></div></main>
<script>const $=s=>document.querySelector(s);let editing='';async function api(path,options={}){const r=await fetch(path,{cache:'no-store',...options,headers:{'Content-Type':'application/json','X-Chainya-Admin':'promos',...(options.headers||{})}});if(r.status===401){location.replace('/manage');throw new Error('Нужен вход')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Не удалось выполнить запрос');return d}function payload(){return{code:$('#code').value.trim().toUpperCase(),discount_percent:+$('#percent').value,min_subtotal:+$('#minimum').value,expires_at:$('#expires').value?new Date($('#expires').value).toISOString():null,active:$('#active').checked,note:$('#note').value.trim()}}function reset(){editing='';$('#form').reset();$('#percent').value=10;$('#minimum').value=0;$('#active').checked=true;$('#code').disabled=false;$('#form-title').textContent='Новый промокод';$('#save').textContent='Создать промокод';$('#reset').hidden=true;$('#status').textContent=''}function edit(p){editing=p.code;$('#code').value=p.code;$('#code').disabled=true;$('#percent').value=p.discount_percent;$('#minimum').value=p.min_subtotal;$('#expires').value=p.expires_at?new Date(p.expires_at).toISOString().slice(0,16):'';$('#active').checked=p.active;$('#note').value=p.note||'';$('#form-title').textContent='Редактирование '+p.code;$('#save').textContent='Сохранить';$('#reset').hidden=false;scrollTo({top:0,behavior:'smooth'})}function render(rows){const box=$('#list');box.replaceChildren();if(!rows.length){box.innerHTML='<p class="muted">Промокодов пока нет.</p>';return}rows.forEach(p=>{const el=document.createElement('article');el.className='promo';const exp=p.expires_at?' · до '+new Date(p.expires_at).toLocaleString('ru-RU'):'',min=p.min_subtotal?' · от '+p.min_subtotal.toLocaleString('ru-RU')+' ₽':'';el.innerHTML=`<div class="promo__top"><strong class="code"></strong><span class="badge ${p.active?'':'off'}">${p.active?'Включён':'Выключен'}</span></div><p class="meta">${p.discount_percent}%${min}${exp}</p><p class="muted"></p><p class="muted">Оплаченных применений: ${p.paid_redemptions||0}</p><div class="actions"><button class="btn" type="button">Редактировать</button></div>`;el.querySelector('.code').textContent=p.code;el.querySelectorAll('.muted')[0].textContent=p.note||'Без заметки';el.querySelector('button').onclick=()=>edit(p);box.append(el)})}async function load(){try{render((await api('/api/admin/promos')).promos||[])}catch(e){$('#list').textContent=e.message}}$('#form').onsubmit=async e=>{e.preventDefault();const b=$('#save');b.disabled=true;$('#status').textContent='Сохраняем…';try{const p=payload();await api(editing?'/api/admin/promos/'+encodeURIComponent(editing):'/api/admin/promos',{method:editing?'PUT':'POST',body:JSON.stringify(p)});reset();await load()}catch(error){$('#status').textContent=error.message}finally{b.disabled=false}};$('#reset').onclick=reset;load();</script></body></html>
